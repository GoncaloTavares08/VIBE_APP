name: Deploy to EC2

# Only deploys after the CI workflow finishes running on `develop` — and only
# if it actually passed. A broken push to `develop` no longer reaches production.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deploy Script on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/VIBE_APP
            git pull origin develop
            bash deploy.sh
