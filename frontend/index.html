
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
      <meta name="theme-color" content="#000000" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <title>VIBE APP</title>
    </head>

    <body>
      <div id="root"></div>
      <!--
        Permanent black strip covering the top safe area (notch/status bar).
        Lives outside the React tree and outside every page's own scroll
        container, so no page's scroll behavior can ever slide content behind
        it or reveal anything else there. No-op on non-notched web browsers,
        since env(safe-area-inset-top) resolves to 0 there.
      -->
      <div
        style="
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: env(safe-area-inset-top);
          background: #0a0a0a;
          z-index: 2147483647;
          pointer-events: none;
        "
      ></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
